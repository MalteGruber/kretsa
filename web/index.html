<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#181818" />
    <title>kretsa</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <button id="toggle-left" class="iconbtn narrow-only" title="Documents & components">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <span class="logo">◆</span>
        <span class="crumbs"><span class="muted">Projects</span><span class="sep">/</span><strong id="project-name">…</strong></span>
      </div>
      <nav id="tabs" class="viewtabs">
        <button data-view="sch"><span class="long">Schematic</span><span class="short">Sch</span></button>
        <button data-view="pcb">PCB</button>
        <button data-view="3d">3D</button>
        <button data-view="split" title="Schematic and PCB side by side, cross-probing"><span class="long">Sch + PCB</span><span class="short">Split</span></button>
      </nav>
      <div class="topright">
        <span id="status" class="status"></span>
        <button id="toggle-comments" class="iconbtn" title="Comments">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z" /></svg>
          <span id="comment-count" class="count"></span>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside id="left" class="panel left">
        <div class="ptabs">
          <button data-ltab="docs" class="active">Documents</button>
          <button data-ltab="comps">Components</button>
        </div>
        <div class="pbody" data-lpane="docs"><ul id="doc-list" class="list"></ul></div>
        <div class="pbody" data-lpane="comps" hidden>
          <input id="comp-search" class="search" placeholder="Search designator, value…" />
          <ul id="comp-list" class="list"></ul>
        </div>
      </aside>

      <section class="stages" id="stages">
        <!-- panes (.stage) are created by main.ts: one per view, two in split mode -->
        <div class="toolbar inkbar" id="inkbar" hidden>
          <button data-tool="pen" title="Freehand: circle parts, underline, cross out">
            <svg viewBox="0 0 24 24"><path d="M3 17c3-6 6 2 9-3s5-6 9-4" /></svg><span>Pen</span>
          </button>
          <button data-tool="rect" title="Box around an area">
            <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1" /></svg><span>Box</span>
          </button>
          <button data-tool="arrow" title="Arrow: move this there">
            <svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9" /></svg><span>Arrow</span>
          </button>
          <span class="tsep"></span>
          <button data-ink="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" /><path d="M4 9h10a6 6 0 010 12h-3" /></svg></button>
          <button data-ink="clear" title="Clear drawing"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" /></svg></button>
          <button data-ink="done" class="done" title="Done: write the comment (Esc)"><span>Done</span></button>
        </div>
        <div class="toolbar" id="toolbar">
          <button data-act="fit" title="Fit document (F)">
            <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          </button>
          <button data-act="zoomsel" title="Zoom to selection (Z)">
            <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" /><path d="M15 15l5 5" /></svg>
          </button>
          <span class="tsep"></span>
          <button data-act="comment" title="Add comment at location (C)">
            <svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z" /><path d="M12 7v6M9 10h6" /></svg>
            <span>Comment</span>
          </button>
          <button data-act="draw" title="Draw on the design (D)">
            <svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z" /><path d="M14 6l3 3" /></svg>
            <span>Draw</span>
          </button>
          <span class="tsep"></span>
          <button data-act="left" title="Toggle panels ([)">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1" /><path d="M9 4v16" /></svg>
          </button>
        </div>
      </section>

      <aside id="right" class="panel right">
        <div class="ptabs">
          <button data-rtab="comments" class="active">Comments</button>
          <button data-rtab="props">Properties</button>
        </div>
        <div class="pbody" data-rpane="comments">
          <div class="cfilter">
            <button data-filter="active" class="active">Open</button>
            <button data-filter="all">All</button>
          </div>
          <ol id="comment-list" class="comments"></ol>
          <form id="composer" class="composer">
            <div id="anchors" class="chips"></div>
            <textarea name="text" rows="3" placeholder="Write a comment for the AI…  (Ctrl+Enter)"></textarea>
            <div class="crow">
              <input name="extra" placeholder="+ anchors: U3, net:VBUS, U3.4" />
              <button type="submit" class="primary">Post</button>
            </div>
          </form>
        </div>
        <div class="pbody" data-rpane="props" hidden>
          <div id="props"></div>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
